[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"
  # Shipped unbundled: native .node addons (canvas), packages that load their own
  # files/workers at runtime (pdf-parse, tesseract.js), and modules loaded via createRequire.
  external_node_modules = [
    "@napi-rs/canvas",
    "@napi-rs/canvas-linux-x64-gnu",
    "pdf-parse",
    "tesseract.js",
    "@tesseract.js-data/eng",
    "word-extractor",
  ]

[[redirects]]
  from = "/api/chat/stream"
  to = "/.netlify/functions/chat-stream"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
